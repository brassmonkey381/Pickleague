<!-- Supabase Auth "Confirm signup" email (PKL-020). Applied by state/confirm-email-code.ps1
     through the Management API (mailer_templates_confirmation_content); this file is the source.
     {{ .Token }} is the 6-digit code the player types on the app's Check your email screen;
     {{ .ConfirmationURL }} is the old link, kept for anyone who'd rather tap. -->
<div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #1c1c1e;">
  <h2 style="margin: 0 0 12px;">Your Pickleague code</h2>
  <p style="margin: 0 0 16px;">Type this code on the Check your email screen to finish signing up:</p>
  <p style="font-size: 32px; font-weight: 700; letter-spacing: 8px; margin: 0 0 20px; color: #12402c;">{{ .Token }}</p>
  <p style="margin: 0 0 20px;">Or tap here instead: <a href="{{ .ConfirmationURL }}" style="color: #1f8a4c;">Confirm my email</a></p>
  <p style="margin: 0; color: #6b6b70; font-size: 13px;">Didn't sign up for Pickleague? Ignore this email and nothing happens.</p>
</div>
